name: DevSecOps Secure Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::816435463113:role/GitHubActions-ECR-Role
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t devsecops-secure-cloud-app:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag devsecops-secure-cloud-app:${{ github.sha }} \
            816435463113.dkr.ecr.eu-north-1.amazonaws.com/devsecops-secure-cloud-app:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            816435463113.dkr.ecr.eu-north-1.amazonaws.com/devsecops-secure-cloud-app:${{ github.sha }}

      - name: Docker image security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 816435463113.dkr.ecr.eu-north-1.amazonaws.com/devsecops-secure-cloud-app:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
